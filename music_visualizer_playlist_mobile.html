<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Cyber Pulse Mobile Playlist</title>
  <style>
    :root { --bg:#040b15; --panel:rgba(10,17,29,.82); --cyan:#45e8ff; --pink:#ff4fc3; --green:#7ef9c6; --line:rgba(92,165,208,.6); }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; height: 100%; overflow: hidden;
      background: radial-gradient(circle at center, #0b1b2d 0%, #050d18 38%, #01050c 100%);
      color: #edfaff; font: 14px/1.4 system-ui, -apple-system, Segoe UI, sans-serif;
      touch-action: manipulation;
    }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    body::before {
      content: ""; position: fixed; inset: 0;
      background: linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
      background-size: 24px 24px; opacity: .7; pointer-events: none;
    }
    .topbar {
      position: fixed; top: max(12px, env(safe-area-inset-top)); left: 12px; right: 12px; z-index: 4;
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
      padding: 12px 14px; border-radius: 16px; border: 1px solid var(--line);
      background: rgba(9,16,27,.78); backdrop-filter: blur(12px);
      box-shadow: 0 0 20px rgba(25,125,180,.25);
    }
    .brand { display: inline-flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .18em; text-transform: uppercase; font-weight: 800; }
    .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--green); box-shadow: 0 0 12px rgba(126,249,198,.8); animation: pulse 1.5s infinite alternate; }
    @keyframes pulse { from { transform: scale(.8); opacity: .75; } to { transform: scale(1.2); opacity: 1; } }
    .status {
      position: fixed; top: max(82px, env(safe-area-inset-top) + 68px); right: 12px; left: 12px; z-index: 4;
      padding: 10px 12px; border-radius: 12px; border: 1px solid rgba(126,249,198,.65);
      background: rgba(7,14,18,.8); color: var(--green); font-size: 10px; letter-spacing: .12em; text-transform: uppercase;
      box-shadow: 0 0 18px rgba(33,145,112,.2); text-align: center; transition: opacity .35s, transform .35s;
    }
    .status.error { border-color: rgba(255,138,193,.8); color: #ff9cc7; }
    .status.compact { left: auto; width: auto; max-width: calc(100% - 24px); padding: 6px 9px; font-size: 9px; letter-spacing: .08em; }
    .status.quiet { opacity: 0; transform: translateY(-5px); pointer-events: none; }
    .controls {
      position: fixed; left: 12px; right: 12px; bottom: max(12px, env(safe-area-inset-bottom)); z-index: 4;
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 12px;
      border-radius: 18px; border: 1px solid rgba(92,165,208,.6); background: rgba(10,17,27,.82);
      box-shadow: 0 0 24px rgba(35,118,190,.22);
    }
    .controls.collapsed { display: none; }
    .settings-toggle { width: auto; min-height: 36px; padding: 7px 10px; font-size: 10px; white-space: nowrap; }
    button, label, select { font: inherit; }
    button, label {
      display: flex; align-items: center; justify-content: center; min-height: 44px; width: 100%; border-radius: 12px;
      border: 1px solid rgba(92,165,208,.6); padding: 10px 12px; color: #effcff;
      background: linear-gradient(135deg, rgba(29,59,90,.9), rgba(104,25,97,.82)); cursor: pointer;
      font-size: 11px; letter-spacing: .08em; text-transform: uppercase; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    button:active { transform: scale(.98); }
    .select-wrap {
      display: flex; align-items: center; gap: 8px; justify-content: center; padding: 7px 10px; border-radius: 12px; border: 1px solid rgba(92,165,208,.6);
      background: rgba(17,27,38,.85); font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
    }
    select {
      width: 100%; background: rgba(11,23,32,.9); color: #edfaff; border: 1px solid rgba(92,165,208,.4); border-radius: 8px; padding: 8px 10px; font-size: 10px; min-width: 0;
    }
    input[type='file'] { display: none; }
    .info-box {
      position: fixed; left: 12px; right: 12px; top: 82px; z-index: 3; padding: 12px; border-radius: 14px; border: 1px solid rgba(255,188,86,.5);
      background: rgba(28,16,12,.55); color: #ffe8b8; font-size: 11px; line-height: 1.5; display: none;
    }
    .info-box.visible { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <div class="topbar">
    <span class="brand"><span>Cyber Pulse</span><span class="dot"></span></span>
    <button class="settings-toggle" id="settingsToggle" type="button" aria-controls="controls" aria-expanded="true">⚙ Einstellungen</button>
  </div>

  <div id="notice" class="info-box"></div>
  <div class="status" id="status">Mikrofon aktivieren</div>

  <section class="controls" id="controls">
    <label for="audioFiles">🎵 Playlist laden</label>
    <input id="audioFiles" type="file" accept="audio/*" multiple />
    <button id="previousTrack" type="button" onclick="playTrack(playlistIndex - 1);">⏮ Zurück</button>
    <button id="nextTrack" type="button" onclick="playTrack(playlistIndex + 1);">Weiter ⏭</button>
    <button id="micBtn" type="button" onclick="startMicrophone();">🎙 Mikrofon</button>
    <button id="testEffect" type="button" onclick="triggerTest();">✨ Test</button>
    <div class="select-wrap">
      <span>Empf.</span>
      <select id="sensitivity">
        <option value="0.35">Leicht</option>
        <option value="3" selected>Normal</option>
        <option value="14">Stark</option>
        <option value="32">Max</option>
      </select>
    </div>
    <div class="select-wrap">
      <span>Effekt</span>
      <select id="effectMode">
        <option value="mix" selected>Mix</option>
        <option value="neon">Neon</option>
        <option value="rings">Ringe</option>
        <option value="shards">Shards</option>
        <option value="fusion">Fusion</option>
      </select>
    </div>
    <button id="stopBtn" type="button" onclick="stopPlayback();" style="grid-column: 1 / -1;">⏹ Stop</button>
  </section>

  <script>
    const c = document.getElementById('canvas');
    const x = c.getContext('2d');
    const status = document.getElementById('status');
    const notice = document.getElementById('notice');
    const file = document.getElementById('audioFiles');
    const sensitivity = document.getElementById('sensitivity');
    const effectMode = document.getElementById('effectMode');
    const controls = document.getElementById('controls');
    const settingsToggle = document.getElementById('settingsToggle');

    let ac, an, src, stream, micGain, raf, playing = false;
    let statusTimer, playlistFiles = [], playlistIndex = -1, loadToken = 0;
    let particles = [], burstParticles = [], barLevels = [], barPhases = [];
    let previousEnergy = 0, previousSpectrum = [], averageEnergy = 0, energyHistory = [];
    let quietFor = 0, lastDropAt = 0, lastRhythmAt = 0, lastFrameAt = 0, beatFlash = 0, rhythmPulse = 0, previousBass = 0, shockwaves = [];
    let micGainValue = 3;

    function showNotice(message) {
      notice.textContent = message;
      notice.classList.add('visible');
    }
    function hideNotice() {
      notice.classList.remove('visible');
    }
    function setStatus(message, { compact = false, error = false, hideAfter = 0 } = {}) {
      clearTimeout(statusTimer);
      status.textContent = message;
      status.classList.toggle('compact', compact);
      status.classList.toggle('error', error);
      status.classList.remove('quiet');
      if (hideAfter) statusTimer = setTimeout(() => status.classList.add('quiet'), hideAfter);
    }
    function toggleSettings(forceCollapsed) {
      const collapsed = forceCollapsed ?? !controls.classList.contains('collapsed');
      controls.classList.toggle('collapsed', collapsed);
      settingsToggle.setAttribute('aria-expanded', String(!collapsed));
      settingsToggle.textContent = collapsed ? '⚙ Einstellungen' : '✕ Schließen';
    }
    settingsToggle.addEventListener('click', () => toggleSettings());
    function fit(){ const d = devicePixelRatio || 1; c.width = innerWidth * d; c.height = innerHeight * d; x.setTransform(d,0,0,d,0,0); }
    addEventListener('resize', fit); fit();
    for (let i = 0; i < 240; i++) particles.push({ a: Math.random() * Math.PI * 2, r: Math.random() * 500, s: 0.3 + Math.random() * 2, spin: (Math.random() - 0.5) * 0.015 });

    function initContext() {
      if (ac) return;
      ac = new (AudioContext || webkitAudioContext)();
      an = ac.createAnalyser();
      an.fftSize = 1024;
      an.minDecibels = -90;
      an.maxDecibels = -18;
      an.smoothingTimeConstant = 0.72;
    }
    async function ensureContext() {
      initContext();
      if (ac.state === 'suspended') await ac.resume();
    }

    function stopPlayback() {
      playing = false;
      loadToken++;
      if (raf) cancelAnimationFrame(raf);
      if (src) { src.onended = null; try { src.stop(); } catch (e) {} if (src.disconnect) src.disconnect(); src = null; }
      if (micGain) { micGain.disconnect(); micGain = null; }
      if (stream) { stream.getTracks().forEach(track => track.stop()); stream = null; }
      if (ac && ac.close) { try { ac.close(); } catch (e) {} }
      ac = null; an = null;
      previousEnergy = 0; previousSpectrum = []; averageEnergy = 0; energyHistory = []; quietFor = 0; lastDropAt = 0; lastRhythmAt = 0; lastFrameAt = 0; previousBass = 0; beatFlash = 0; rhythmPulse = 0; burstParticles = []; shockwaves = [];
      setStatus('Gestoppt');
      x.fillStyle = '#02040c'; x.fillRect(0,0,innerWidth,innerHeight);
    }

    function updateSensitivity(){ micGainValue = Number(sensitivity.value); if (micGain) micGain.gain.value = micGainValue; }
    function sensitivityFactor(){ return [.55,1,1.8,3.2][sensitivity.selectedIndex] || 1; }

    function triggerBurst(cx, cy, power = 1) {
      const mode = effectMode.value; const isFusion = mode === 'fusion'; const level = sensitivityFactor(); const intensity = power * (0.95 + level * 0.3);
      const particleCount = mode === 'neon' ? 70 : isFusion ? 120 : mode === 'shards' ? 64 : mode === 'mix' ? 56 : 0;
      if (mode === 'mix' || mode === 'rings' || isFusion) {
        for (let i = 0; i < (mode === 'rings' ? 4 : isFusion ? 5 : 2); i++) shockwaves.push({ r: 25 + i * 18, life: 1, power: intensity });
      }
      if (particleCount) {
        for (let i = 0; i < particleCount; i++) {
          const a = Math.random() * Math.PI * 2; const speed = (2 + Math.random() * 7) * intensity; const orbit = mode === 'shards' || isFusion ? 1.8 : 1;
          burstParticles.push({ x: cx, y: cy, vx: Math.cos(a) * speed * orbit, vy: Math.sin(a) * speed * orbit, life: 1, size: (mode === 'neon' || isFusion ? 3 : 2) + Math.random() * (mode === 'neon' || isFusion ? 5 : 4), hue: mode === 'neon' || isFusion ? 185 + Math.random() * 175 : Math.random() * 360, shard: mode === 'shards' || isFusion });
        }
      }
      beatFlash = Math.min(1, beatFlash + (isFusion ? 1.2 : .9) * intensity);
    }

    function triggerTest() {
      triggerBurst(innerWidth / 2, innerHeight / 2, 1.4);
      setStatus('Effekt testen', { compact: true, hideAfter: 1800 });
      if (!playing) requestAnimationFrame(drawDemo);
    }
    function drawDemo() {
      if (playing) return;
      requestAnimationFrame(drawDemo);
      const w = innerWidth, h = innerHeight, cx = w / 2, cy = h / 2;
      x.fillStyle = 'rgba(2,4,12,.22)'; x.fillRect(0,0,w,h);
      for (const p of burstParticles) {
        p.x += p.vx; p.y += p.vy; p.vx *= .985; p.vy *= .985; p.life -= .018;
        x.fillStyle = `hsla(${p.hue},100%,70%,${Math.max(0,p.life)})`; x.beginPath();
        if (p.shard) { x.save(); x.translate(p.x,p.y); x.rotate(Math.atan2(p.vy,p.vx)); x.fillRect(-p.size,-p.size/2,p.size*3,p.size); x.restore(); }
        else { x.arc(p.x,p.y,p.size * (0.5 + p.life), 0, Math.PI * 2); x.fill(); }
      }
      burstParticles = burstParticles.filter(p => p.life > 0);
      for (const wave of shockwaves) { wave.r += 10; wave.life -= .025; x.strokeStyle = `rgba(100,230,255,${Math.max(0,wave.life * .7)})`; x.lineWidth = 2 + wave.life * 4; x.beginPath(); x.arc(cx,cy,wave.r,0,Math.PI*2); x.stroke(); }
      shockwaves = shockwaves.filter(wave => wave.life > 0);
      x.fillStyle = `rgba(100,220,255,${beatFlash * .08})`; x.fillRect(0,0,w,h); beatFlash *= .9;
    }

    async function playTrack(index) {
      if (index < 0 || index >= playlistFiles.length) return;
      const token = ++loadToken;
      playing = false;
      if (src) {
        src.onended = null;
        try { src.stop(); } catch (e) {}
        src.disconnect();
        src = null;
      }
      playlistIndex = index;
      const track = playlistFiles[index];
      setStatus(`Lade ${index + 1}/${playlistFiles.length}: ${track.name}`, { compact: true });
      try {
        await ensureContext();
        const buffer = await ac.decodeAudioData(await track.arrayBuffer());
        if (token !== loadToken) return;
        src = ac.createBufferSource();
        src.buffer = buffer;
        src.connect(an);
        an.connect(ac.destination);
        src.onended = () => {
          if (!playing || token !== loadToken) return;
          if (playlistIndex + 1 < playlistFiles.length) {
            playTrack(playlistIndex + 1);
          } else {
            playing = false;
            src = null;
            setStatus('Playlist beendet', { compact: true, hideAfter: 3000 });
          }
        };
        src.start();
        playing = true;
        toggleSettings(true);
        setStatus(`${index + 1}/${playlistFiles.length} · ${track.name}`, { compact: true, hideAfter: 3000 });
        draw();
      } catch (err) {
        if (token === loadToken) setStatus('Fehler: ' + err.message, { error: true });
      }
    }

    file.addEventListener('change', event => {
      playlistFiles = Array.from(event.target.files || []);
      if (playlistFiles.length) {
        stopPlayback();
        playTrack(0);
      }
    });

    async function startMicrophone() {
      try {
        const isSafeContext = window.isSecureContext || location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1';
        if (!isSafeContext || location.protocol === 'file:') {
          setStatus('Bitte über localhost oder https öffnen', { error: true });
          showNotice('Ja, das ist das eigentliche Problem: iPhone/iPad erlauben Mikrofonzugriff in Safari/Chrome nur in einem sicheren Browser-Kontext. Öffne die Seite als echte Website über localhost oder HTTPS und tippe dann erneut auf Mikrofon.');
          return;
        }
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          setStatus('Mikrofon nicht unterstützt', { error: true });
          showNotice('Dieser Browser unterstützt kein Mikrofon-API. Nutze stattdessen eine Audio-Datei.');
          return;
        }
        if (playing || stream || src) stopPlayback();
        setStatus('Mikrofon anfragen…', { compact: true }); hideNotice();
        await ensureContext();
        const permission = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: false,
            noiseSuppression: false,
            autoGainControl: false,
            channelCount: 1,
            sampleRate: 44100
          }
        });
        stream = permission;
        src = ac.createMediaStreamSource(stream);
        micGain = ac.createGain(); micGain.gain.value = micGainValue;
        src.connect(micGain); micGain.connect(an); an.connect(ac.destination);
        playing = true;
        toggleSettings(true);
        setStatus('Mikrofon aktiv', { compact: true, hideAfter: 2200 });
        draw();
      } catch (err) {
        setStatus('Zugriff verweigert', { error: true });
        showNotice('Bitte erneut auf Mikrofon tippen. Wenn Safari/Chrome danach trotzdem keine Abfrage zeigt, liegt es am sicherheitsgebundenen iPhone-/iPad-Kontext: Dann bitte nur über localhost oder HTTPS öffnen.');
      }
    }

    document.addEventListener('touchstart', () => {
      if (!ac) return;
      if (ac.state === 'suspended') ac.resume().catch(() => {});
    }, { passive: true });

    document.addEventListener('pointerdown', () => {
      if (!ac) return;
      if (ac.state === 'suspended') ac.resume().catch(() => {});
    }, { passive: true });

    function draw() {
      if (!playing) return;
      raf = requestAnimationFrame(draw);
      const n = an.frequencyBinCount; const data = new Uint8Array(n); an.getByteFrequencyData(data);
      const w = innerWidth, h = innerHeight, cx = w / 2, cy = h / 2, now = performance.now() / 1000;
      const bass = data.slice(0,16).reduce((a,b) => a+b,0) / 16 / 255;
      x.fillStyle = 'rgba(2,4,12,.18)'; x.fillRect(0,0,w,h);
      const grad = x.createRadialGradient(cx,cy,20,cx,cy,Math.min(w,h) * .65); grad.addColorStop(0, `hsla(${190 + bass * 100},90%,35%,.14)`); grad.addColorStop(1, 'transparent'); x.fillStyle = grad; x.fillRect(0,0,w,h);
      for (let layer = 0; layer < 4; layer++) {
        x.beginPath();
        for (let i = 0; i <= 220; i++) {
          const a = (i / 220) * Math.PI * 2; const amp = data[i % n] / 255; const r = 55 + layer * 28 + amp * (110 + layer * 35) + Math.sin(a * (7 + layer) + now * 3) * 10; const px = cx + Math.cos(a) * r; const py = cy + Math.sin(a) * r; x.lineTo(px, py);
        }
        x.closePath(); x.strokeStyle = `hsla(${(now * 70 + layer * 70) % 360},95%,65%,${0.75 - layer * 0.12})`; x.lineWidth = layer === 0 ? 3 : 1.5; x.shadowBlur = layer === 0 ? 18 : 0; x.shadowColor = x.strokeStyle; x.stroke(); x.shadowBlur = 0;
      }
      const barCount = Math.min(128, Math.max(40, Math.floor(w / 12))); const barWidth = w / barCount;
      if (barLevels.length !== barCount) { barLevels = Array(barCount).fill(0); barPhases = Array.from({ length: barCount }, () => Math.random() * Math.PI * 2); }
      const spectrumEnergy = data.reduce((sum, value) => sum + value, 0) / (n * 255);
      const frameDelta = lastFrameAt ? Math.min(.08, Math.max(.008, now - lastFrameAt)) : .016; lastFrameAt = now;
      const energyRise = spectrumEnergy - previousEnergy; const flux = data.reduce((sum, value, index) => sum + Math.max(0, value - (previousSpectrum[index] || 0)), 0) / (n * 255); previousSpectrum = Array.from(data);
      energyHistory.push(spectrumEnergy); if (energyHistory.length > 90) energyHistory.shift();
      const localAverage = energyHistory.reduce((sum, value) => sum + value, 0) / Math.max(1, energyHistory.length); const baseline = Math.max(.012, averageEnergy || localAverage); averageEnergy = averageEnergy * .96 + spectrumEnergy * .04;
      const novelty = Math.max(0, energyRise) + flux * .35; const sensitivityValue = sensitivityFactor(); const isQuiet = spectrumEnergy < Math.max(.012, localAverage * (0.9 - .04 * sensitivityValue)) && bass < Math.max(.04, localAverage * 1.3); quietFor = isQuiet ? Math.min(2, quietFor + frameDelta) : Math.max(0, quietFor - frameDelta * .3);
      const relativeJump = spectrumEnergy / Math.max(.01, baseline); const cooldown = now - lastDropAt > Math.max(.24, .72 - .15 * sensitivityValue); const onset = (energyRise > Math.max(.00035, baseline * .008 / sensitivityValue) && flux > Math.max(.00035, baseline * .022 / sensitivityValue)) || (energyRise > Math.max(.0002, baseline * .004 / sensitivityValue) && flux > Math.max(.0007, baseline * .012 / sensitivityValue) && novelty > .02); const dropDetected = cooldown && quietFor > .004 && spectrumEnergy > Math.max(.014, baseline * (1.002 - .015 * sensitivityValue)) && relativeJump > 1.002 && onset;
      const bassRise = bass - previousBass; const rhythmCooldown = Math.max(.1, .24 - .04 * sensitivityValue); const rhythmHit = bass > Math.max(.12, .2 - .025 * sensitivityValue) && bassRise > Math.max(.018, .04 - .006 * sensitivityValue) && now - lastRhythmAt > rhythmCooldown; previousBass = bass; previousEnergy = spectrumEnergy;
      if (rhythmHit) { lastRhythmAt = now; rhythmPulse = Math.min(1, rhythmPulse + .85 * sensitivityValue); triggerBurst(cx,cy, .5 + .24 * sensitivityValue); }
      beatFlash *= .88; rhythmPulse *= .9;
      if (dropDetected) { lastDropAt = now; quietFor = 0; triggerBurst(cx,cy, Math.min(1.6, 1 + bass * .8)); }
      for (const p of burstParticles) { p.x += p.vx * (1 + bass); p.y += p.vy * (1 + bass); p.vx *= .985; p.vy *= .985; p.life -= .018; x.fillStyle = `hsla(${p.hue},100%,70%,${Math.max(0,p.life)})`; x.beginPath(); if (p.shard) { x.save(); x.translate(p.x,p.y); x.rotate(Math.atan2(p.vy,p.vx)); x.fillRect(-p.size,-p.size/2,p.size*3,p.size); x.restore(); } else { x.arc(p.x,p.y,p.size * (0.5 + p.life), 0, Math.PI * 2); x.fill(); } }
      burstParticles = burstParticles.filter(p => p.life > 0);
      for (const wave of shockwaves) { wave.r += 8 + energyRise * 80; wave.life -= .025; x.strokeStyle = `rgba(100,230,255,${Math.max(0,wave.life * .7)})`; x.lineWidth = 2 + wave.life * 4; x.beginPath(); x.arc(cx,cy,wave.r,0,Math.PI*2); x.stroke(); }
      shockwaves = shockwaves.filter(wave => wave.life > 0);
      if (bass > .72 || beatFlash > .12) {
        for (let i = 0; i < 18; i++) {
          const y = Math.random() * h; const stripeH = 2 + Math.random() * 7; const gloss = 18 + Math.random() * 80; const glitchX = Math.random() * w; const hue = (i * 22 + now * 220) % 360;
          x.fillStyle = `hsla(${hue},100%,68%,${0.25 + Math.random() * 0.4})`; x.fillRect(glitchX + Math.sin(now + i) * 12, y, gloss + Math.random() * 180, stripeH);
          x.fillStyle = `hsla(${(hue + 110) % 360},100%,65%,${0.2 + Math.random() * 0.3})`; x.fillRect(glitchX - 12, y + 1, gloss * 0.6 + Math.random() * 120, stripeH * 0.55);
        }
      }
      const floorLevel = Math.min(.24, .025 + spectrumEnergy * .35 + bass * .1);
      for (let i = 0; i < barCount; i++) {
        const normalized = i / (barCount - 1); const sourceIndex = Math.min(n - 1, Math.floor(Math.pow(normalized, .82) * n * .55)); const raw = data[sourceIndex] / 255; const travelWave = (Math.sin(now * 3.2 - normalized * 15 + barPhases[i]) + .5 * Math.sin(now * 5.1 - normalized * 31 + barPhases[i] * .7) + 1.5) / 3.0; const variation = .12 + travelWave * .88; const boost = 1 + bass * .9; const target = Math.min(.98, floorLevel + (0.18 + spectrumEnergy * .8 + bass * .45) * variation + raw * boost * .2); const level = barLevels[i]; barLevels[i] = target > level ? level + (target - level) * .3 : Math.max(floorLevel, level * .97); const v = Math.max(floorLevel, barLevels[i]); const bh = Math.min(h * .58, (.08 + v * .42) * h * .72); const hue = (normalized * 330 + now * 35) % 360; const xPos = Math.floor(i * barWidth); const columnWidth = Math.max(3, Math.floor(barWidth) - 2); x.fillStyle = `hsla(${hue},95%,${55 + v * 25}%,0.8)`; x.fillRect(xPos, h - bh, columnWidth, bh);
      }
      for (const p of particles) { p.r += p.s * (.5 + bass * 2); p.a += p.spin; if (p.r > Math.max(w,h) * .75) p.r = 20; const px = cx + Math.cos(p.a) * p.r; const py = cy + Math.sin(p.a) * p.r * .62; const sz = 1 + Math.random() * 2 + bass * 4; x.fillStyle = `hsla(${(p.a * 80 + now * 90) % 360},100%,70%,${0.25 + bass * 0.7})`; x.fillRect(px,py,sz,sz); }
      if (beatFlash > .02) { x.fillStyle = `rgba(100,220,255,${beatFlash * .08})`; x.fillRect(0,0,w,h); }
      const coreHue = (now * 180 + bass * 220) % 360; x.fillStyle = `hsla(${coreHue},100%,74%,0.98)`; x.beginPath(); x.arc(cx,cy,14 + bass * 24 + beatFlash * 10 + rhythmPulse * 14,0,Math.PI * 2); x.fill(); x.strokeStyle = `hsla(${(coreHue + 110) % 360},100%,72%,${0.7 + beatFlash})`; x.lineWidth = 2 + beatFlash * 3; x.beginPath(); x.arc(cx,cy,20 + bass * 28 + beatFlash * 12 + rhythmPulse * 18,0,Math.PI * 2); x.stroke();
    }
